spring.application.name=gst-batch

server.servlet.context-path=/api
server.port=8089

# =========================================================
# ORACLE / HIKARICP
# =========================================================

spring.datasource.hikari.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.jdbc-url=jdbc:oracle:thin:@10.153.181.6:1525:stagedb
spring.datasource.hikari.username=acs_mast
spring.datasource.hikari.password=stage123


# =========================================================
# DATASOURCE & HIKARICP CONFIGURATION
# =========================================================
spring.datasource.hikari.pool-name=Gst3bHikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hikari keepaliveTime is in milliseconds (fixed: was set to 1200ms, changed to 120,000ms / 2 mins)
spring.datasource.hikari.keepalive-time=120000

# Transactions control commit/rollback
spring.datasource.hikari.auto-commit=true

# Oracle connection validation
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# Connection leak detection (2 minutes)
spring.datasource.hikari.leak-detection-threshold=120000


# =========================================================
# JDBC TEMPLATE
# =========================================================
# Global defaults (individual queries can override)
spring.jdbc.template.fetch-size=1000
spring.jdbc.template.query-timeout=300


# =========================================================
# CONSOLIDATED GST BATCH CONFIGURATION (BatchProperties)
# =========================================================
# Core GST 3B Batch Settings
gst.batch.enabled=true
gst.batch.chunk-size=500
gst.batch.fetch-size=1000
gst.batch.write-batch-size=500
gst.batch.process-period=
gst.batch.lookback-months=12
gst.batch.max-records=0
gst.batch.max-retry=3
gst.batch.lock-minutes=120
gst.batch.continue-on-error=true
gst.batch.audit-failures=true

# Model Settings
gst.batch.model.path=classpath:models/gst_risk_model.json
gst.batch.model.name=GST_3B_XGB
gst.batch.model.version=1.0.0
gst.batch.model.feature-version=18F_V1
gst.batch.model.feature-count=18

# Risk Thresholds
gst.batch.risk.critical-threshold=0.80
gst.batch.risk.high-threshold=0.60
gst.batch.risk.medium-threshold=0.35

# Retry Settings
gst.batch.retry.max-attempts=3
gst.batch.retry.backoff-ms=1000
gst.batch.retry.multiplier=2

# Execution Settings
gst.batch.execution.run-on-startup=false
gst.batch.execution.cron=0 0 2 1 * *
gst.batch.execution.prevent-overlap=true
gst.batch.execution.lock-name=GST_3B_MONTHLY_BATCH

# Defaulter Batch Settings (Mapped to BatchProperties.Defaulter)
gst.batch.defaulter.chunk-size=1000
gst.batch.defaulter.max-retry=3
gst.batch.defaulter.retry-backoff-ms=1000
gst.batch.defaulter.lock-minutes=120
gst.batch.defaulter.scheduler-enabled=false
gst.batch.defaulter.cron=0 30 2 * * *

gst.revenue.master-office-name-column=JURISDICTION_NAME


# =========================================================
# DEFAULTER SOURCE REPOSITORY CONFIGURATION
# =========================================================
# QRMP table schema & prefix dynamic naming
gst.defaulter.registration-schema=GST_REGISTRATION
gst.defaulter.registration-table-prefix=qrmp_freq
gst.defaulter.registration-table=
gst.defaulter.history-months=36
gst.defaulter.query-timeout-seconds=300


# =========================================================
# INDIVIDUAL SERVICE STEP CONFIGURATIONS
# =========================================================
# Growth Step (GstGrowthService)
gst.growth.chunk-size=50000
gst.growth.chunk-retries=2

# Risk Step (RiskScoringServiceImpl)
gst.risk.chunk-size=5000
gst.risk.chunk-retries=2
gst.risk.max-failure-percent=1.0


# =========================================================
# SYSTEM, LOGGING & SHUTDOWN CONFIGURATION
# =========================================================
logging.level.gov.com.ai.webapp=INFO
# logging.level.gov.com.ai.webapp.repository.DefaulterSourceRepository=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [batch=%X{batchId} run=%X{runId} period=%X{retPeriod}] %logger{30} - %msg%n

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=90s
